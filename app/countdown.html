<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0e1116" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#eef1f4" media="(prefers-color-scheme: light)">
  <meta name="description" content="Countdown timer with an analog face and digital readout.">
  <title>Countdown</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <!-- Icon sprite (own drawings, 24×24, drawn in currentColor). -->
  <svg class="sprite" aria-hidden="true" focusable="false">
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.2v13.6L18.8 12z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6.5" y="5" width="4" height="14" rx="1" fill="currentColor" stroke="none"/><rect x="13.5" y="5" width="4" height="14" rx="1" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.6" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-reset" viewBox="0 0 24 24"><path d="M5.24 13.81A7 7 0 1 0 7.05 7.05"/><path d="M11 6.7L7.05 7.05 7.4 3.1"/></symbol>
    <symbol id="i-sound" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path d="M15.5 9.2a4 4 0 0 1 0 5.6M18.2 6.6a7.6 7.6 0 0 1 0 10.8"/></symbol>
    <symbol id="i-muted" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path d="M15.5 9.5l5 5M20.5 9.5l-5 5"/></symbol>
    <symbol id="i-fs" viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></symbol>
    <symbol id="i-install" viewBox="0 0 24 24"><path d="M12 4v10.5M8 10.5l4 4 4-4"/><path d="M5 16.5V19h14v-2.5"/></symbol>
    <symbol id="i-fs-exit" viewBox="0 0 24 24"><path d="M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5"/></symbol>
  </svg>

  <!-- Everything is laid out inside .app; when the window is smaller than the
       minimum layout, app.js scales .app down as a whole (no scroll bars). -->
  <div class="app" id="app">
  <main class="stage">
    <div class="face" id="face" role="timer" aria-label="Countdown timer">
      <svg viewBox="-100 -100 200 200" aria-hidden="true">
        <circle class="disc" r="98"/>
        <g class="ticks" id="ticks"></g>
        <g class="labels" id="labels"></g>
        <circle class="track" r="73"/>
        <circle class="arc-hours" r="73"/>
        <circle class="arc" id="arc" r="73" pathLength="100" transform="rotate(-90)"/>
        <g class="hour-labels" id="hourLabels"></g>
        <circle class="porthole" r="50"/>
        <!-- Hands start at the edge of the digital readout's "porthole" so they
             never cover the digits. All three run counter-clockwise to 12. -->
        <g class="hand hand-hour" id="hourHand"><line y1="-52.5" y2="-56.5"/></g>
        <g class="hand hand-min" id="minHand"><line y1="-52" y2="-88"/><circle cy="-73" r="4"/></g>
        <g class="hand hand-sec" id="secHand"><line y1="-51" y2="-95"/><circle cy="-51" r="1.6"/></g>
      </svg>
      <div class="readout">
        <div class="digits" id="digits">05:00</div>
        <div class="bar" id="bar" role="progressbar" aria-label="Elapsed"
             aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="barFill"></span></div>
        <div class="status" id="status">ready</div>
      </div>
      <!-- Controls overlaid on the clock, shown only while the pointer is over
           it or keyboard focus is inside (#12). Their box is transparent and
           only as big as the controls; clicks anywhere else start/pause. -->
      <div class="controls" id="controls">
        <div class="row setter" id="setter">
          <input id="inH" inputmode="numeric" maxlength="2" aria-label="Hours"   value="00">
          <span class="colon">:</span>
          <input id="inM" inputmode="numeric" maxlength="2" aria-label="Minutes" value="05">
          <span class="colon">:</span>
          <input id="inS" inputmode="numeric" maxlength="2" aria-label="Seconds" value="00">
          <select id="presetSelect" class="preset-select" aria-label="Preset duration">
            <option value="">Preset…</option>
            <option value="1">1m</option>
            <option value="5">5m</option>
            <option value="10">10m</option>
            <option value="15">15m</option>
            <option value="25">25m</option>
            <option value="45">45m</option>
            <option value="60">1h</option>
          </select>
        </div>
        <div class="row actions">
          <button class="icon primary" id="startBtn" title="Start (Space)" aria-label="Start"><svg aria-hidden="true"><use href="#i-play"/></svg></button>
          <button class="icon" id="resetBtn" title="Reset (R / Esc)" aria-label="Reset"><svg aria-hidden="true"><use href="#i-reset"/></svg></button>
          <button class="icon" id="muteBtn" title="Mute (M)" aria-label="Mute" aria-pressed="false"><svg aria-hidden="true"><use href="#i-sound"/></svg></button>
          <button class="icon" id="fsBtn" title="Fullscreen (F)" aria-label="Fullscreen"><svg aria-hidden="true"><use href="#i-fs"/></svg></button>
          <!-- Hidden unless the browser says the page can be installed and isn't yet; see "install" in app.js. -->
          <button class="icon" id="installBtn" title="Install as an app" aria-label="Install as an app" hidden><svg aria-hidden="true"><use href="#i-install"/></svg></button>
        </div>
      </div>
    </div>
  </main>
  </div>
</body>
</html>
